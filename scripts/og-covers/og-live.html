<!-- THE LIVE-ITINERARY COVER — `/s/<code>` (ADR-0220's 2026-09-05 amendment, per-trip since
     2026-09-06).
     Owner: _"Why doesn't the live sharing screen look different?"_ It shared the brand
     cover, which made an itinerary sent to family indistinguishable from a marketing link.

     **It is the reader page's own top, edge to edge and cropped** — `.sh-page`,
     `.sh-public-bar`, `.sh-brand`, `.sh-hero`, `.sh-kicker`, `.sh-title`, `.sh-title-mark`,
     `.sh-live-dot`, `.sh-dates`, `.sh-story`, `.sh-days-head`, every one of them
     `screens/shared-itinerary.css`'s shipped rules. Same move as the invitation cover
     borrowing the join ticket, and for the same reason: the artwork cannot drift from the
     page it advertises.

     **The `{{…}}` slots are the trip's own** — see `og-invite.html`'s header for the two
     fillers. `icon` and `name` slots sit in `.sh-title-mark`/`.sh-title`, which is exactly
     where `SharedItinerary.tsx` puts `projection.trip.icon` and `projection.trip.name`; the
     wordmark this cover used to print in that slot was standing in for a trip.

     Three things make it unmistakably this page rather than the other two covers, and none
     of them is a decorative choice:

     • **The wash is TEAL.** `.sh-hero` paints `radial-gradient(circle at 8% 14%,
       rgba(44,156,144,0.22) …)` where the other covers carry the amber one. Teal is location
       (ADR-0028) and a live itinerary is about where the group is — the shipped screen's own
       spend, not a new one.
     • **The live dot is `--ok`**, the reader's own freshness mark. It sits in the BAR beside
       the wordmark rather than in the kicker, and that placement is the eleventh amendment's
       rule honoured rather than broken: `מסלול חי` was wrong in the kicker because the
       kicker is where the TRIP's phase belongs, and a constant there printed "live" over a
       trip that ended six months ago. In the bar it describes the LINK — this URL re-reads
       itself — which is true whatever the trip is doing, and the kicker gets a real fact
       back.
     • **It has the page's light body under a dark masthead**, which is also what gives it an
       edge against a dark WhatsApp bubble. That bright half is the page's own content rather
       than a strip added to buy an edge — which is the distinction the retired paper band
       failed (ADR-0220's amendment §E).

     **`brandMark` is a data URL, not a path.** The renderer aborts every request before
     the content is set, so `src="/icon-mark-bright.svg"` would draw a broken box — and
     hand-inlining the mark here is what `README.md` says never to do. Both fillers read the
     same `frontend/public/icon-mark-bright.svg` the page itself loads.

     **Cropped at 630, deliberately.** The zoomed page runs past the bottom of the cover, so
     the day list is cut mid-card exactly as a screenshot of a scrolling page would be, and
     nothing here states a height that could go stale. Nothing counts down, either — see
     `og-invite.html` for why a cached cover may not carry a number that moves. -->
<div class="og-cover og-cover--page">
  <div class="og-art og-art--bleed">
    <!-- ⁦3⁩ = ⁦1200 / 400⁩: the page is laid out at a 400px base — inside ADR-0017's 360-430
         phone band — and zoomed to the cover's width. It was ⁦3.33⁩ (a 360px base) until the
         masthead grew the page's own brand bar: measured, the bar is ⁦42⁩ CSS px and the hero
         ⁦132⁩, against the ⁦189⁩ a ⁦3.33⁩ crop shows at all, so the story card below them was down
         to a ⁦15px⁩ sliver. ⁦3⁩ shows ⁦210⁩, which gives the card back. `zoom` rather than `transform: scale` because it
         affects LAYOUT — see `_cover.css`; a transform would need the scaled height written
         down somewhere, and that number goes stale the first time a word changes. -->
    <div class="og-zoom" style="--og-z: 3">
      <div class="sh-page">
        <div class="sh-public-bar">
          <span class="sh-brand">
            <img class="sh-brand-mark" src="{{{brandMark}}}" alt="" width="20" height="20" />
            Travelive
          </span>
          <span class="sh-bar-end">
            <span class="sh-freshness">
              <span class="sh-live-dot"></span>
              מסלול חי
            </span>
          </span>
        </div>
        <header class="sh-hero">
          <div class="sh-kicker"><strong>{{kicker}}</strong></div>
          <h1 class="sh-title">
            <span class="sh-title-mark" aria-hidden="true">{{icon}}</span>
            <span>{{name}}</span>
          </h1>
          <div class="sh-dates">{{dates}}</div>
        </header>
        <!-- The narrative card, in the slot the reader's own generated summary sits in. It
             stays generic on purpose: `previewByCode` is the cheap read that must never wake
             the narrative generator for a crawler, so this says what the LINK is. -->
        <div class="sh-story">
          <strong>הלו״ז החי של הטיול</strong>
          <p>מתעדכן מעצמו כשמשהו זז, בלי לשלוח לינק חדש.</p>
        </div>
        <div class="sh-days">
          <div class="sh-days-head">
            <h2>המסע יום אחר יום</h2>
            <span>כל יום לפי חלקיו</span>
          </div>
          <!-- One day card, cut off by the cover's own edge — the "there is more below this"
               that a masthead alone cannot say. -->
          <div class="sh-day"><div class="sh-day-head"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
