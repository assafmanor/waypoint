<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The invitation link-preview cover (ADR-0220 §3) — `/join/<code>`.
       Transcribed from `mockups/the-app-is-seen-before-it-is-opened-v1.html` §3, where it
       is drawn with `App.css`'s SHIPPED `.join-ticket` rules at 1.85x rather than by hand.

       **It is the join screen's own boarding pass, not a second invitation graphic.** Root
       `CLAUDE.md` rule 8: `.join-ticket` already MEANS "an invitation" in this app, so the
       cover borrows its gradient, its amber radial, its `.ticket-badge` pill and its
       perforation. A drawing of its own would have gone out of step with the screen the
       link opens the first time either changed.

       **The ticket carries no trip name, and cannot.** This is one PNG cut at build time
       and served to every crawler; whatever identifies a trip lives in `og:title` /
       `og:description`, which is why the strings mattered more than the artwork. The words
       here are deliberately about the act, not the trip.

       **Same band as `og-cover.svg`, for the same measured reason** — the first draft of
       this file was a plain board and would have shipped the 1.25:1 hole §2 rejects. The
       band also gives the cover the one word the ticket cannot: `הזמנה לטיול` is 10.5px
       inside the ticket's own badge at bubble scale, i.e. decoration, and 40px here.

       Literal colours, because a PNG has no theme — `tokens.css`'s light values byte for
       byte. Rasterized by `node scripts/gen-app-icons.mjs`. -->
  <defs>
    <linearGradient id="inv-board" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#152137" />
      <stop offset="0.62" stop-color="#0e1729" />
    </linearGradient>
    <radialGradient id="inv-aura" cx="0.84" cy="0.06" r="0.74">
      <stop offset="0" stop-color="#e9a63c" stop-opacity="0.17" />
      <stop offset="0.62" stop-color="#e9a63c" stop-opacity="0" />
    </radialGradient>
    <!-- `.join-ticket`'s own `linear-gradient(180deg, var(--board-2), var(--board))`. -->
    <linearGradient id="inv-ticket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152137" />
      <stop offset="1" stop-color="#0e1729" />
    </linearGradient>
    <!-- `.join-ticket::before` — the amber wash from the top-right corner of the pass. -->
    <radialGradient id="inv-ticket-glow" cx="0.85" cy="0" r="0.9">
      <stop offset="0" stop-color="#e9a63c" stop-opacity="0.14" />
      <stop offset="0.6" stop-color="#e9a63c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="inv-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37b3a3" />
      <stop offset="1" stop-color="#1f7d73" />
    </linearGradient>
    <linearGradient id="inv-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b65a" />
      <stop offset="1" stop-color="#e09a2f" />
    </linearGradient>
    <linearGradient id="inv-disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182642" />
      <stop offset="1" stop-color="#0e1729" />
    </linearGradient>
    <filter id="inv-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#inv-board)" />
  <rect width="1200" height="496" fill="url(#inv-aura)" />

  <!-- The wordmark row, RTL: the mark trails the name exactly as `.join-top` puts
       `.join-icon` after `.join-logo`. -->
  <g transform="translate(660 52)">
    <g transform="scale(0.125)">
      <circle cx="256" cy="256" r="256" fill="url(#inv-disc)" />
      <g transform="translate(256 268) scale(0.66) translate(-256 -260)">
        <path
          d="M256 44 C150 44 66 126 66 230 C66 348 206 436 256 476 C306 436 446 348 446 230 C446 126 362 44 256 44 Z"
          fill="url(#inv-teal)"
        />
        <circle
          cx="256"
          cy="216"
          r="96"
          fill="none"
          stroke="#f2b65a"
          stroke-width="9"
          opacity="0.42"
        />
        <circle cx="256" cy="216" r="66" fill="#f2b65a" filter="url(#inv-glow)" opacity="0.7" />
        <circle cx="256" cy="216" r="60" fill="url(#inv-amber)" />
      </g>
    </g>
  </g>
  <!-- Latin, so no `direction` and `end` genuinely means the left edge: the wordmark's
       right edge butts against the mark at x=644. -->
  <text
    x="632"
    y="98"
    fill="#ffffff"
    font-family="Secular One, sans-serif"
    font-size="46"
    text-anchor="end"
  >
    Travelive
  </text>

  <!-- The pass. 555x361 is `.join-ticket` at 300px wide, scaled 1.85x — the scale the
       mockup's measurement table asserts fits inside the canvas the band leaves. The 2.6x
       first draft put the perforation and the avatars outside 630px and `overflow: hidden`
       ate them. Radius 20px * 1.85 = 37. -->
  <g transform="translate(322 140)">
    <rect width="555" height="361" rx="37" fill="url(#inv-ticket)" />
    <rect width="555" height="361" rx="37" fill="url(#inv-ticket-glow)" />
    <rect
      width="555"
      height="361"
      rx="37"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.08"
      stroke-width="1.85"
    />

    <!-- **`text-anchor="start"`, not `"end"`, on every RTL line below.** SVG resolves the
         anchor against the inline-base direction, so under `direction="rtl"` `start` is the
         RIGHT edge and `end` is the left one. The first cut of this file used `end` for
         right-aligned Hebrew, which pinned each line's LEFT edge and let it flow rightward
         out of the ticket — `יוצאים לדרך` ran 200px past the pass and the avatars landed on
         top of `החבורה כבר בפנים`. Invisible in the markup, obvious in the PNG.

         `.ticket-top` has 18px of padding, so the trailing edge is 555 − 18 × 1.85 = 522. -->

    <!-- `.ticket-badge`: amber text on an amber tint with an amber hairline, 99px radius.
         Sized to its text (11 Hebrew glyphs at 19px plus the pill's 10px padding, ×1.85)
         rather than to a round number, and the text centred in it the way an inline-flex
         with padding centres its own content. -->
    <g transform="translate(372 33)">
      <rect width="150" height="42" rx="21" fill="#e9a63c" fill-opacity="0.13" />
      <rect
        width="150"
        height="42"
        rx="21"
        fill="none"
        stroke="#e9a63c"
        stroke-opacity="0.3"
        stroke-width="1.85"
      />
      <text
        x="75"
        y="29"
        fill="#e9a63c"
        font-family="Assistant, sans-serif"
        font-size="19"
        font-weight="700"
        letter-spacing="1.5"
        text-anchor="middle"
        direction="rtl"
      >
        הזמנה לטיול
      </text>
    </g>

    <!-- `.ticket-name` at 24px × 1.85 = 44. Says the act, since it cannot say the trip. -->
    <text
      x="522"
      y="150"
      fill="#ffffff"
      font-family="Secular One, sans-serif"
      font-size="44"
      text-anchor="start"
      direction="rtl"
    >
      יוצאים לדרך
    </text>
    <!-- `.ticket-meta` at 12.5px × 1.85 = 23. No `·`: the owner asked for the separator to
         stay off these surfaces, so the line is one phrase instead of two. -->
    <text
      x="522"
      y="192"
      fill="#93a2c4"
      font-family="Assistant, sans-serif"
      font-size="23"
      text-anchor="start"
      direction="rtl"
    >
      כל הטיול נפתח בלינק אחד
    </text>

    <!-- `.ticket-perf`: a 2px dashed tear line with a round notch cut from each edge. -->
    <line
      x1="0"
      y1="240"
      x2="555"
      y2="240"
      stroke="#ffffff"
      stroke-opacity="0.14"
      stroke-width="3.7"
      stroke-dasharray="11 11"
    />
    <circle cx="0" cy="240" r="17" fill="#0e1729" />
    <circle cx="555" cy="240" r="17" fill="#0e1729" />

    <!-- `.ticket-bottom`, RTL: `.ticket-avatars` is the first child so it sits at the
         trailing edge, then `.ticket-people` to its left. Three 31px faces at ×1.85 with
         `.ticket-av`'s −9px overlap: r 28.5, centres 40 apart, the stack ending at 522. -->
    <circle cx="493" cy="297" r="28.5" fill="#3f6ea8" stroke="#0e1729" stroke-width="3.7" />
    <circle cx="453" cy="297" r="28.5" fill="#3f8f7d" stroke="#0e1729" stroke-width="3.7" />
    <circle cx="413" cy="297" r="28.5" fill="#a8763f" stroke="#0e1729" stroke-width="3.7" />
    <text
      x="365"
      y="290"
      fill="#eaf0ff"
      font-family="Assistant, sans-serif"
      font-size="24"
      font-weight="700"
      text-anchor="start"
      direction="rtl"
    >
      החבורה כבר בפנים
    </text>
    <text
      x="365"
      y="320"
      fill="#93a2c4"
      font-family="Assistant, sans-serif"
      font-size="20"
      text-anchor="start"
      direction="rtl"
    >
      מחכים רק לך
    </text>
  </g>

  <rect x="0" y="496" width="1200" height="134" fill="#f3efe6" />
  <text
    x="600"
    y="576"
    fill="#4b5468"
    font-family="Assistant, sans-serif"
    font-size="40"
    font-weight="600"
    text-anchor="middle"
    direction="rtl"
  >
    הזמנה לטיול
  </text>
</svg>
