      body {
        margin: 0;
      }
      .pane {
        position: relative;
        height: 600px;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./snap-sheet-harness.tsx"></script>
  </body>
</html>
