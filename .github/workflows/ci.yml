name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: {}

env:
  DATABASE_URL: postgresql://waypoint:waypoint@localhost:5432/waypoint?schema=public
  JWT_SECRET: ci-test-secret
  TOKEN_ENCRYPTION_KEY: A93ozxE1Pars878weaD+YXKkS1Noa88RS14JYzfl3vw=

jobs:
  ci:
    runs-on: ubuntu-latest
    # **A hung step must fail, not sit** (2026-08-19). `e2e (dev)` stalled inside
    # `playwright install --with-deps chromium` and, with no timeout, held the PR's check
    # `in_progress` for 90 minutes on its way to the 360-minute default — a stuck leg reads
    # exactly like a slow one, so nobody knows to re-run it. Both jobs run in well under
    # 10 minutes (ci ~3.5, e2e preview ~5.5, the longer of that matrix's two legs), so this
    # is roughly triple the real ceiling: generous for a slow runner, decisive for a hang.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
          POSTGRES_DB: waypoint
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U waypoint"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @waypoint/backend prisma:generate
      - run: pnpm --filter @waypoint/backend exec prisma migrate deploy
      # not `pnpm run prisma:seed`: that script hardcodes `node --env-file=.env`,
      # which errors when no `.env` file exists (as in CI, where DATABASE_URL
      # comes from this workflow's `env:` block instead).
      - run: pnpm --filter @waypoint/backend exec node prisma/seed.mjs

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check

  # Browser-contract e2e (ADR-0090 system-back). Hermetic — the frontend dev
  # server boots with the API route-mocked in-test (frontend/e2e/boot.ts), so no
  # Postgres/backend is needed; only the shared package must be built for the
  # frontend to import. Kept a separate job from the unit `ci` above (which runs
  # in jsdom and needs no browser).
  #
  # Two legs, on two runners, in PARALLEL — a matrix expands into independent jobs,
  # so this costs runner-minutes rather than wall clock (the `preview` leg is the
  # longer of the two, since `pnpm build` sits in front of its server).
  #
  # The second leg is not a re-run (ADR-0186 amendment 269i): it serves the
  # PRODUCTION BUNDLE, so it is the only one that asserts asset paths, chunk
  # boundaries and worker URLs — the class of fact that hid a blank map for a full
  # session while the dev-server leg stayed green. `fail-fast` is off because which
  # leg fails is the diagnosis: dev too means a logic bug, preview only means a
  # build-time one.
  #
  # `MAP_TILES_E2E=1` stays opt-in and out of CI: it range-reads Protomaps' planet
  # build, so it would make every run depend on a vendor host being up.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: [dev, preview]
    env:
      E2E_PREVIEW: ${{ matrix.server == 'preview' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waypoint/shared build
      - run: pnpm --filter @waypoint/frontend exec playwright install --with-deps chromium
      - run: pnpm --filter @waypoint/frontend e2e
